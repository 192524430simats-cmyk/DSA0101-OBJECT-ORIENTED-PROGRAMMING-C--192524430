<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#132238}.box{fill:white;stroke:#2563eb;stroke-width:2}.head{font-size:21px;font-weight:bold}.body{font-size:15px}.arrow{stroke:#dc2626;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker></defs><rect class="box" x="25" y="30" width="285" height="275" rx="8"/><text class="head" x="167" y="66" text-anchor="middle">Bill vtable</text><text class="body" x="48" y="112">~Bill → Bill::~Bill</text><text class="body" x="48" y="158">total → pure virtual slot</text><text class="body" x="48" y="204">type → base/default slot</text><text class="body" x="48" y="250">show → non-virtual (not a slot)</text><rect class="box" x="357" y="30" width="285" height="275" rx="8"/><text class="head" x="499" y="66" text-anchor="middle">OutPatientBill vtable</text><text class="body" x="380" y="112">~OutPatientBill → derived dtor</text><text class="body" x="380" y="158">total → outpatient total()</text><text class="body" x="380" y="204">type → outpatient type()</text><text class="body" x="380" y="250">show → inherited function</text><rect class="box" x="690" y="30" width="285" height="275" rx="8"/><text class="head" x="832" y="66" text-anchor="middle">InPatientBill vtable</text><text class="body" x="713" y="112">~InPatientBill → derived dtor</text><text class="body" x="713" y="158">total → inpatient total()</text><text class="body" x="713" y="204">type → inpatient type()</text><text class="body" x="713" y="250">show → inherited function</text><rect class="box" x="365" y="395" width="270" height="70" rx="8"/><text class="body" x="500" y="424" text-anchor="middle">Bill* b = new OPBill;</text><text class="body" x="500" y="448" text-anchor="middle">b-&gt;show() then dispatches total()</text><path class="arrow" d="M500 395 C500 345 480 330 480 305"/><text class="body" x="500" y="493" text-anchor="middle">dynamic type selects the matching derived slot</text></svg>
