<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510"><rect width="900" height="510" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#132238}.box{fill:white;stroke:#2563eb;stroke-width:2}.line{stroke:#334155;stroke-width:2;fill:none}.head{font-size:22px;font-weight:bold}.body{font-size:16px}</style><rect class="box" x="320" y="25" width="260" height="115" rx="8"/><text class="head" x="450" y="57" text-anchor="middle">&lt;&lt;abstract&gt;&gt; Bill</text><text class="body" x="340" y="88">+ virtual ~Bill()</text><text class="body" x="340" y="115">+ virtual total() = 0</text><text class="body" x="340" y="135">+ virtual type(), print()</text><path class="line" d="M450 140V190M112 190H788M112 190V235M337 190V235M562 190V235M788 190V235"/><rect class="box" x="22" y="235" width="180" height="130" rx="8"/><text class="head" x="112" y="271" text-anchor="middle">OutPatientBill</text><text class="body" x="37" y="307">consultation, tests</text><text class="body" x="37" y="337">overrides total/type</text><rect class="box" x="247" y="235" width="180" height="130" rx="8"/><text class="head" x="337" y="271" text-anchor="middle">InPatientBill</text><text class="body" x="262" y="307">days, daily rate, care</text><text class="body" x="262" y="337">overrides total/type</text><rect class="box" x="472" y="235" width="180" height="130" rx="8"/><text class="head" x="562" y="271" text-anchor="middle">DayCareBill</text><text class="body" x="487" y="307">package amount</text><text class="body" x="487" y="337">overrides total/type</text><rect class="box" x="698" y="235" width="180" height="130" rx="8"/><text class="head" x="788" y="271" text-anchor="middle">EmergencyBill</text><text class="body" x="713" y="307">base, time charges</text><text class="body" x="713" y="337">overrides total/type</text><text class="body" x="450" y="435" text-anchor="middle">Each derived object can be processed through a Bill reference or pointer.</text></svg>
